<!DOCTYPE html>

<head>

  <style>
    /* ===== ESTILOS ESPECÍFICOS DA PÁGINA CONTATO ===== */
    body {
      background-color: #fffafc;
      color: #444;
      font-family: "Poppins", sans-serif;
    }

    main {
      padding-top: 120px;
      text-align: center;
    }

    section#contato {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
    }

    #contato h2 {
      font-size: 2rem;
      color: #af670a;
      margin-bottom: 10px;
      font-family: "Amsterdam", cursive;
    }

    #contato p.intro {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 30px;
    }

    .contato-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .contato-info a {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      color: #444;
      text-decoration: none;
      background: #fef5f7;
      padding: 12px 20px;
      border-radius: 30px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    .contato-info a:hover {
      background: #ffe0e9;
      transform: translateY(-2px);
    }

    .contato-info img.icon {
      width: 24px;
      height: 24px;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #777;
    }



    .contato-info img.icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      object-fit: contain;
    }
  </style>
</head>

<body>

<script>

    "botId": "belle-bot", // substitua se o ID for diferente
    "clientId": "BXQ4IDK9", // o mesmo que está no seu script hospedado
    "hideWidget": false,
    "disableAnimations": false,
    "enableTranscriptDownload": false,
    "showBotInfoPage": false,
    "className": "belle-bot",
    "stylesheet": "",
    "containerWidth": "100%",
    "layoutWidth": "100%",
    "config": {
      "enableReset": false
    }
  };
</script>

<script src="https://files.bpcontent.cloud/2025/11/03/12/20251103122449-BXQ4IDK9.js" defer></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const checkBelle = setInterval(() => {
      const belleContainer = document.querySelector(".bp-widget-container");

      if (belleContainer) {
        clearInterval(checkBelle);

        // === Se for a página de agendamento ===
        if (window.location.pathname.includes("agendamento.html")) {
          belleContainer.classList.add("belle-centralizada");

          const banner = document.querySelector(".banner-belle");
          if (banner && banner.parentNode) {
            banner.parentNode.insertBefore(belleContainer, banner.nextSibling);
          }

        } else {
          // === Nas outras páginas ===
          belleContainer.classList.remove("belle-centralizada");
          belleContainer.style.position = "fixed";
          belleContainer.style.bottom = "20px";
          belleContainer.style.right = "20px";
          belleContainer.style.zIndex = "9999";
        }
      }
    }, 500);
  });
</script>

  <script src="js/script.js"></script>

</body>
